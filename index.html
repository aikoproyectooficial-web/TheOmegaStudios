    <!-- SCRIPTS (Al final de todo) -->
    <script>
        const carrusel = document.getElementById('carruselContenedor');
        const items = carrusel.querySelectorAll('.carrusel-item');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');

        let currentIndex = 0;

        function updateCarrusel() {
            const totalItems = items.length;
            const prevIndex = (currentIndex - 1 + totalItems) % totalItems;
            const nextIndex = (currentIndex + 1) % totalItems;

            items.forEach((item, index) => {
                item.classList.remove('active', 'prev', 'next');
            
                if (index === currentIndex) {
                    item.classList.add('active');
                
                    if (item.classList.contains('item-video')) {
                        carrusel.classList.add('active-is-video');
                    } else {
                        carrusel.classList.remove('active-is-video');
                    }
                
                } else if (index === prevIndex) {
                    item.classList.add('prev');
                } else if (index === nextIndex) {
                    item.classList.add('next');
                }
            });
        }

        function cambiarImagen(direccion) {
            const totalItems = items.length;
            currentIndex = (currentIndex + direccion + totalItems) % totalItems;
            updateCarrusel();
        }
